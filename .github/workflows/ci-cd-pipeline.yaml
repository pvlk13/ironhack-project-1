name: CI/CD to EKS (Docker Hub + buildx)
on: 
  push:
   branches: ["vijaya"]
  workflow_dispatch:
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}
  INGRESS_HOST: ${{ secrets.INGRESS_HOST }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}  
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
jobs:
  build-and-push:
      name: Build & Push Images (redis,postgres,worker,vote,result)
      runs-on: ubuntu-latest
      steps:
         - name: checkout
           uses: actions/checkout@v4
         - name: pull Image
           run: docker pull redis:alpine
         - name: Log in to Docker Hub
           run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-std
         - name: push to docker hub redis repo   
           run:  docker push vijayakurra/redis-workflow-kube:latest  
         - name: build Image
           run: |
              docker buildx build --platform linux/amd64 -t vijayakurra/vote-workflow-kube:latest ./vote/ 
              docker buildx build --platform linux/amd64 -t vijayakurra/result-workflow-kube:latest ./result/
              docker buildx build --platform linux/amd64 -t vijayakurra/worker-workflow-kube:latest ./worker/

         - name: Log in to Docker Hub
           run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
         - name: Push image
           run: |
              docker push vijayakurra/vote-workflow-kube:latest
              docker push vijayakurra/result-workflow-kube:latest
              docker push vijayakurra/worker-workflow-kube:latest
              docker push redis:alphine vijayakurra/redis-workflow-kube:latest
              
              
              
           
