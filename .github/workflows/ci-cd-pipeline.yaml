name: CI/CD to EKS (Docker Hub + Buildx)

on: 
  push:
    branches: ["vijaya"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}
  INGRESS_HOST: ${{ secrets.INGRESS_HOST }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-and-push:
    name: Build & Push Images (redis, postgres, worker, vote, result)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Setup buildx for amd64 ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Login once (avoid redundancy) ---
      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # --- Pull official redis + postgres images ---
      - name: Pull Redis & Postgres images
        run: |
          docker pull redis:alpine
          docker pull postgres:15-alpine

      # --- Retag redis + postgres to your namespace ---
      - name: Retag official images
        run: |
          docker tag redis:alpine $DOCKERHUB_USERNAME/redis-workflow-kube:latest
          docker tag postgres:15-alpine $DOCKERHUB_USERNAME/postgres-workflow-kube:15-alpine

      # --- Build your custom images ---
      - name: Build custom images (amd64)
        run: |
          docker buildx build --platform linux/amd64 -t $DOCKERHUB_USERNAME/vote-workflow-kube:latest ./vote --load
          docker buildx build --platform linux/amd64 -t $DOCKERHUB_USERNAME/result-workflow-kube:latest ./result --load
          docker buildx build --platform linux/amd64 -t $DOCKERHUB_USERNAME/worker-workflow-kube:latest ./worker --load

      # --- Push everything ---
      - name: Push all images to Docker Hub
        run: |
          docker push $DOCKERHUB_USERNAME/redis-workflow-kube:latest
          docker push $DOCKERHUB_USERNAME/postgres-workflow-kube:15-alpine
          docker push $DOCKERHUB_USERNAME/vote-workflow-kube:latest
          docker push $DOCKERHUB_USERNAME/result-workflow-kube:latest
          docker push $DOCKERHUB_USERNAME/worker-workflow-kube:latest
  deploy:
    name: Deploy to EKS 
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials(keys-based for this lab)
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Update Kubeconfig for EKS
        run: |
           aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
      - name: Verify access
        run: |
          kubectl version 
          kubectl get ns
          kubectl get ingress -A || true          
      - name: Create namespace if missing
        run: |
          kubectl get ns "$K8S_NAMESPACE" || kubectl create ns "$K8S_NAMESPACE"
      - name: Apply base k8s (safe re-apply)
        run: |
          kubectl apply -f k8s/vijaya-namespace.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-redis-service.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-postgres-service.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-ingresses.yaml 
          kubectl apply -f k8s/vijaya-namespace.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-vote-services.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-result-services.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-worker-service.yaml 
      - name: Compute image tags
        id:   tag 
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "redis_image=${DOCKER_ORG}/redis-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "vote_image=${DOCKER_ORG}/vote-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "result_image=${DOCKER_ORG}/result-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "worker_image=${DOCKER_ORG}/worker-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT       
          echo "postgres_image=${DOCKER_ORG}/result-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
      - name: Ensure Deployments exist
        run: |
           kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-postgres-deployment.yaml
           kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-redis-deployment.yaml  
           kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-result-deployment.yaml
           kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-vote-deployment.yaml    
           kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-worker-deployment.yaml 
      - name: Set images to new SHA tag
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-redis-deployment    redis="${{ steps.tag.outputs.redis_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-worker-deployment   worker="${{ steps.tag.outputs.worker_image }}" 
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-result-deployment   result="${{ steps.tag.outputs.result_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-vote-deployment     vote="${{ steps.tag.outputs.vote_image }}" 
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-postgres-deployment postgres="${{ steps.tag.outputs.postgres_image }}"

      - name: Apply Storage + PVC + Deployments + Services
        run: |
          kubectl apply -f k8s/vijaya-sc.yaml
          kubectl apply -f k8s/vijaya-pvc.yaml
          kubectl apply -f k8s/vijaya-postgres-deployment.yaml
          kubectl apply -f k8s/vijaya-postgres-service.yaml

      # Make sure the ingress host matches your Route 53 record (idempotent patch)
      - name: Patch Vote Ingress
        run: |
         kubectl patch ingress vijaya-ingress-vote \
         -n $K8S_NAMESPACE \
         -p "{\"spec\":{\"rules\":[{\"host\":\"${{ secrets.INGRESS_HOST_VOTE }}\"}]}}"

      - name: Patch Result Ingress
        run: |
         kubectl patch ingress vijaya-ingress-result \
         -n $K8S_NAMESPACE \
         -p "{\"spec\":{\"rules\":[{\"host\":\"${{ secrets.INGRESS_HOST_RESULT }}\"}]}}"

      - name: Wait for rollout (backend)
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-vote-deployment --timeout=120s
 
      - name: Wait for rollout (frontend)
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-result-deployment --timeout=120s 
      - name: Wait for rollout (backend)
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-worker-deployment --timeout=120s
 
      - name: Wait for rollout (frontend)
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-redis-deployment --timeout=120s   
      - name: Wait for rollout (backend)
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-postgres-deployment --timeout=120s
      - name: Quick smoke test via Ingress
        run: |
          # You need DNS already pointing at the NGINX Ingress ELB (previous lab).
          # Test the API route:
          curl -s --fail "http://${INGRESS_HOST}/ping" | tee /tmp/api.txt
          echo
          echo "Response above should contain a ping or message from backend."    
 
         