name: CI/CD to EKS (Docker Hub + Buildx)

on:
  push:
    branches: ["vijaya"]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  STUDENT_NAME: ${{ secrets.STUDENT_NAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Pull official images ---
      - name: Pull official Redis & Postgres images
        run: |
          docker pull redis:alpine
          docker pull postgres:15-alpine

      # --- Tag & Push official images ---
      - name: Tag & Push Redis/Postgres
        run: |
          docker tag redis:alpine $DOCKER_ORG/redis-workflow-kube:latest
          docker tag postgres:15-alpine $DOCKER_ORG/postgres-workflow-kube:15-alpine
          docker push $DOCKER_ORG/redis-workflow-kube:latest
          docker push $DOCKER_ORG/postgres-workflow-kube:15-alpine

      # --- Build & Push custom images ---
      - name: Build & Push Vote/Result/Worker
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          for APP in vote result worker; do
            docker buildx build --platform linux/amd64 \
              -t $DOCKER_ORG/${APP}-workflow-kube:${SHA_TAG} ./$APP --load
            docker push $DOCKER_ORG/${APP}-workflow-kube:${SHA_TAG}
          done

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Ensure namespace exists
        run: |
          kubectl get ns "$K8S_NAMESPACE" || kubectl create ns "$K8S_NAMESPACE"

      #INSTALL TRAEFIK INGRESS CONTROLLER
      - name: Install Traefik Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v2.10/docs/content/reference/dynamic-configuration/kubernetes-crd.yml
          kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v2.10/docs/content/user-guides/crd-acme/traefik-ingress-controller.yaml

      # --- Apply StorageClass & PVC ---
      - name: Apply Storage + PVC
        run: |
          kubectl apply -f k8s/vijaya-sc.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-pvc.yaml
      # --- Compute image tags in deploy job ---
      - name: Compute image tags
        id: tag
        run: |
          SHA_TAG=${GITHUB_SHA::7}
          echo "redis_image=${DOCKER_ORG}/redis-workflow-kube:latest" >> $GITHUB_OUTPUT
          echo "postgres_image=${DOCKER_ORG}/postgres-workflow-kube:15-alpine" >> $GITHUB_OUTPUT
          echo "vote_image=${DOCKER_ORG}/vote-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "result_image=${DOCKER_ORG}/result-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "worker_image=${DOCKER_ORG}/worker-workflow-kube:${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Debug – Print computed images
        run: |
          echo "Redis: ${{ steps.tag.outputs.redis_image }}"
          echo "Postgres: ${{ steps.tag.outputs.postgres_image }}"
          echo "Vote: ${{ steps.tag.outputs.vote_image }}"
          echo "Result: ${{ steps.tag.outputs.result_image }}"
          echo "Worker: ${{ steps.tag.outputs.worker_image }}"

      - name: Apply deployments if missing
        run: |
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-redis-deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-postgres-deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-vote-deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-result-deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-worker-deployment.yaml
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-ingresses.yaml
      - name: Apply Postgres StatefulSet
        run: |
          kubectl apply -n "$K8S_NAMESPACE" -f k8s/vijaya-postgres-statefulset.yaml    

      - name: Set images to new tags
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-redis-deployment redis="${{ steps.tag.outputs.redis_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-postgres-deployment postgres="${{ steps.tag.outputs.postgres_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-vote-deployment vote="${{ steps.tag.outputs.vote_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-result-deployment result="${{ steps.tag.outputs.result_image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/vijaya-worker-deployment worker="${{ steps.tag.outputs.worker_image }}"

      - name: Wait for rollout
        run: |
          for DEPLOY in redis postgres vote result worker; do
            kubectl -n "$K8S_NAMESPACE" rollout status deployment/vijaya-${DEPLOY}-deployment --timeout=300s
          done
      - name: Quick smoke test via Ingress
        run: |
          echo "Testing Vote app..."
          curl -s --fail "http://app.vijaya.vote.diogohack.shop/ping" | tee /tmp/vote.txt
          echo "Vote app response above."

          echo "Testing Result app..."
          curl -s --fail "http://app.vijaya.result.diogohack.shop/ping" | tee /tmp/result.txt
          echo "Result app response above."
  
